<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>频率 bin 分解：train / val / gap</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 12px; background: #fafafa; }
  h2 { font-size: 1.1em; }
  .chart { width: 100%; max-width: 900px; height: 480px; margin: 12px 0; }
  .controls { margin: 8px 0; font-size: 0.9em; }
  .controls button { padding: 4px 10px; margin: 2px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
  .controls button.active { background: #333; color: #fff; }
  .note { font-size: 0.85em; color: #666; margin: 8px 0; }
</style></head><body>
<h2>频率 bin 分解：train / val / gap</h2>
<p class="note">input 注入 run。每条线 = 一个频率桶。novel = train 中未出现的 context（仅 val）。epoch2@337, epoch3@686。</p>

    <div class="controls">
      <b>曲线:</b> <button class="active" onclick="setCurve('both')">train+val</button>
      <button onclick="setCurve('gap')">gap</button>
      <b>指标:</b> <button class="active" onclick="setMetric('per_token')">per-token loss</button>
      <button onclick="setMetric('total')">总贡献</button>
      <b>context:</b> <button class="active" onclick="setBranch('bigram')">bigram</button>
      <button onclick="setBranch('trigram')">trigram</button>
    </div>
    <div id="freq_chart" class="chart"></div>
    
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<script>
    var series = {"bigram": {"novel": {"steps": [1000], "train_loss": [0.0], "val_loss": [6.058858777805724], "train_frac": [0.0], "val_frac": [0.04345872667100695]}, "1": {"steps": [1000], "train_loss": [2.2170071563254368], "val_loss": [5.379165881341747], "train_frac": [0.034779866536458336], "val_frac": [0.022038777669270832]}, "2": {"steps": [1000], "train_loss": [2.325967265051717], "val_loss": [5.155515018507629], "train_frac": [0.022118462456597224], "val_frac": [0.015852186414930556]}, "3": {"steps": [1000], "train_loss": [2.4318094453820405], "val_loss": [4.9852762939223565], "train_frac": [0.016364203559027776], "val_frac": [0.012556287977430556]}, "4": {"steps": [1000], "train_loss": [2.5561848170913892], "val_loss": [4.857492541435448], "train_frac": [0.013070000542534722], "val_frac": [0.010389539930555556]}, "5": {"steps": [1000], "train_loss": [2.615034536136692], "val_loss": [5.0009500933608315], "train_frac": [0.010986328125], "val_frac": [0.008899264865451388]}, "6-10": {"steps": [1000], "train_loss": [2.773904658456868], "val_loss": [4.652407206697257], "train_frac": [0.03966098361545139], "val_frac": [0.03466966417100695]}, "11-20": {"steps": [1000], "train_loss": [3.03771962562355], "val_loss": [4.464521129698368], "train_frac": [0.048884073893229164], "val_frac": [0.04535251193576389]}, "21-50": {"steps": [1000], "train_loss": [3.3127424012384687], "val_loss": [4.384535583761392], "train_frac": [0.08481682671440972], "val_frac": [0.0802341037326389]}, "51-100": {"steps": [1000], "train_loss": [3.5147893729516753], "val_loss": [4.32543424374207], "train_frac": [0.0829281277126736], "val_frac": [0.08133612738715278]}, "101-200": {"steps": [1000], "train_loss": [3.593386113103884], "val_loss": [4.285183172235393], "train_frac": [0.1037631564670139], "val_frac": [0.1033664279513889]}, "201-500": {"steps": [1000], "train_loss": [3.6759771325604698], "val_loss": [4.17960964963501], "train_frac": [0.16800096299913195], "val_frac": [0.1661919487847222]}, "501-1k": {"steps": [1000], "train_loss": [3.735038902266921], "val_loss": [4.115556869859493], "train_frac": [0.1343909369574653], "val_frac": [0.1360965304904514]}, "1k-5k": {"steps": [1000], "train_loss": [4.223634719260928], "val_loss": [4.494633032381505], "train_frac": [0.1254814995659722], "val_frac": [0.1252627902560764]}, "5k+": {"steps": [1000], "train_loss": [4.530321916474579], "val_loss": [4.807178341041057], "train_frac": [0.11475457085503472], "val_frac": [0.11429511176215278]}}, "trigram": {"novel": {"steps": [1000], "train_loss": [5.029306051353295], "val_loss": [4.990917931408312], "train_frac": [0.0007408989800347222], "val_frac": [0.3148549397786458]}, "1": {"steps": [1000], "train_loss": [3.29634605209029], "val_loss": [4.519004313906521], "train_frac": [0.2756212022569444], "val_frac": [0.083587646484375]}, "2": {"steps": [1000], "train_loss": [3.3703958899664057], "val_loss": [4.409708206351612], "train_frac": [0.09583028157552083], "val_frac": [0.048348320855034724]}, "3": {"steps": [1000], "train_loss": [3.4642045555787995], "val_loss": [4.396594608135945], "train_frac": [0.0540313720703125], "val_frac": [0.034615410698784724]}, "4": {"steps": [1000], "train_loss": [3.527833032040511], "val_loss": [4.30361655407351], "train_frac": [0.03817409939236111], "val_frac": [0.026304456922743056]}, "5": {"steps": [1000], "train_loss": [3.5306646180492725], "val_loss": [4.3195458023518665], "train_frac": [0.028867933485243056], "val_frac": [0.021940443250868056]}, "6-10": {"steps": [1000], "train_loss": [3.6041854010341745], "val_loss": [4.279583125185096], "train_frac": [0.09075927734375], "val_frac": [0.07281494140625]}, "11-20": {"steps": [1000], "train_loss": [3.701051271177554], "val_loss": [4.227635831675905], "train_frac": [0.08660210503472222], "val_frac": [0.0770450168185764]}, "21-50": {"steps": [1000], "train_loss": [3.8243808099524785], "val_loss": [4.214980239083649], "train_frac": [0.10488722059461805], "val_frac": [0.09878370496961805]}, "51-100": {"steps": [1000], "train_loss": [3.9213111994492693], "val_loss": [4.154503956149833], "train_frac": [0.06778971354166667], "val_frac": [0.06520589192708333]}, "101-200": {"steps": [1000], "train_loss": [3.9501275142922267], "val_loss": [4.153419655490132], "train_frac": [0.053843180338541664], "val_frac": [0.052897135416666664]}, "201-500": {"steps": [1000], "train_loss": [4.015532436985868], "val_loss": [4.17278263460257], "train_frac": [0.04951646592881945], "val_frac": [0.050252278645833336]}, "501-1k": {"steps": [1000], "train_loss": [4.197669756279289], "val_loss": [4.260250248605764], "train_frac": [0.021440294053819444], "val_frac": [0.021891276041666668]}, "1k-5k": {"steps": [1000], "train_loss": [4.247740319248017], "val_loss": [4.299854677864015], "train_frac": [0.021867540147569444], "val_frac": [0.021874321831597224]}, "5k+": {"steps": [1000], "train_loss": [3.5576693493427296], "val_loss": [3.6328487194659065], "train_frac": [0.010028415256076388], "val_frac": [0.009584214952256944]}}};
    var bucketOrder = ["novel", "1", "2", "3", "4", "5", "6-10", "11-20", "21-50", "51-100", "101-200", "201-500", "501-1k", "1k-5k", "5k+"];
    var bucketColors = {"novel": "#E91E63", "1": "#F44336", "2": "#FF5722", "3": "#FF9800", "4": "#FFC107", "5": "#FFEB3B", "6-10": "#CDDC39", "11-20": "#8BC34A", "21-50": "#4CAF50", "51-100": "#009688", "101-200": "#00BCD4", "201-500": "#03A9F4", "501-1k": "#2196F3", "1k-5k": "#3F51B5", "5k+": "#673AB7"};
    var curCurve = "both";
    var curMetric = "per_token";
    var curBranch = "bigram";

    function getTraces() {
      var traces = [];
      var data = series[curBranch];
      for (var i = 0; i < bucketOrder.length; i++) {
        var b = bucketOrder[i];
        var d = data[b];
        if (d.steps.length === 0) continue;
        var y;
        if (curCurve === "gap") {
          y = d.steps.map(function(s, j) { return d.val_loss[j] - d.train_loss[j]; });
        } else if (curMetric === "per_token") {
          // both: show val only for clarity, plus train as dashed
          y = d.val_loss;
        } else {
          // total contrib
          y = d.steps.map(function(s, j) { return d.val_frac[j] * d.val_loss[j]; });
        }
        traces.push({
          x: d.steps, y: y, mode: "lines+markers", name: b,
          line: {color: bucketColors[b], width: 2},
          visible: curCurve === "both" ? true : true
        });
        if (curCurve === "both" && curMetric === "per_token") {
          traces.push({
            x: d.steps, y: d.train_loss, mode: "lines", name: b + " (train)",
            line: {color: bucketColors[b], width: 1, dash: "dash"}, visible: false
          });
        }
      }
      return traces;
    }

    function plot() {
      var traces = getTraces();
      var shapes = [
        {type: "line", x0: 337, x1: 337, y0: 0, y1: 1, yref: "paper", line: {color: "#ccc", dash: "dot"}},
        {type: "line", x0: 686, x1: 686, y0: 0, y1: 1, yref: "paper", line: {color: "#ccc", dash: "dot"}}
      ];
      var title = curBranch + " | " + (curCurve === "gap" ? "gap (val-train)" : (curMetric === "per_token" ? "val loss (per-token)" : "val total contrib"));
      Plotly.newPlot("freq_chart", traces, {
        title: title, xaxis: {title: "step"}, yaxis: {title: curMetric === "total" ? "frac × loss" : "loss"},
        margin: {l:60,r:30,t:50,b:50}, shapes: shapes, legend: {x: 0.02, y: 0.98, font: {size: 9}}
      });
    }

    function setCurve(c) { curCurve = c; document.querySelectorAll('.controls button').forEach(function(b){b.classList.remove('active')}); plot(); }
    function setMetric(m) { curMetric = m; plot(); }
    function setBranch(b) { curBranch = b; plot(); }
    plot();
    </script>
</body></html>
