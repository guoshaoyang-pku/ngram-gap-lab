<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>命中频次分布 + 末态 gap</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 12px; background: #fafafa; }
  h2 { font-size: 1.1em; }
  .chart { width: 100%; max-width: 900px; height: 320px; margin: 10px 0; }
  .controls { margin: 8px 0; font-size: 0.9em; }
  .controls button { padding: 4px 10px; margin: 2px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
  .controls button.active { background: #333; color: #fff; }
  .note { font-size: 0.85em; color: #666; margin: 8px 0; }
</style></head><body>
<h2>命中频次分布 + 末态 gap</h2>
<p class="note">柱：train/val token fraction；曲线：最后一个 checkpoint 的 per-bucket gap = val loss − train loss。</p>

    <div class="controls">
      <b>context:</b>
      <button class="active" onclick="plotDist('bigram', this)">bigram</button>
      <button onclick="plotDist('trigram', this)">trigram</button>
    </div>
    <div id="dist_chart" class="chart"></div>
    
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<script>
    var gapData = {"bigram": [{"bucket": "novel", "gap": 13.094940295815746, "train_loss": 0.0, "val_loss": 13.094940295815746, "train_frac": 0.0, "val_frac": 0.043065388997395836}, {"bucket": "1", "gap": 11.534540391335323, "train_loss": 0.2825824169432476, "val_loss": 11.81712280827857, "train_frac": 0.035515679253472224, "val_frac": 0.021879408094618056}, {"bucket": "2", "gap": 10.34390245212295, "train_loss": 0.6728494404701303, "val_loss": 11.016751892593081, "train_frac": 0.021904839409722224, "val_frac": 0.015494452582465278}, {"bucket": "3", "gap": 9.377202116820435, "train_loss": 0.9304110993140233, "val_loss": 10.307613216134458, "train_frac": 0.015758938259548612, "val_frac": 0.012586805555555556}, {"bucket": "4", "gap": 9.063850640463219, "train_loss": 1.0423545926784503, "val_loss": 10.106205233141669, "train_frac": 0.013192070855034722, "val_frac": 0.010484483506944444}, {"bucket": "5", "gap": 8.828389622227093, "train_loss": 1.161860519577052, "val_loss": 9.990250141804145, "train_frac": 0.011101616753472222, "val_frac": 0.009228176540798612}, {"bucket": "6-10", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "11-20", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "21-50", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "51-100", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "101-200", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "201-500", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "501-1k", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "1k-5k", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "5k+", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}], "trigram": [{"bucket": "novel", "gap": 4.631804521922209, "train_loss": 4.506965595564246, "val_loss": 9.138770117486455, "train_frac": 0.0007510715060763889, "val_frac": 0.312957763671875}, {"bucket": "1", "gap": 7.305633663084213, "train_loss": 0.9184644851535152, "val_loss": 8.224098148237728, "train_frac": 0.2776743570963542, "val_frac": 0.08408949110243055}, {"bucket": "2", "gap": 6.305232832249715, "train_loss": 1.5070894112523223, "val_loss": 7.812322243502037, "train_frac": 0.0950469970703125, "val_frac": 0.04951646592881945}, {"bucket": "3", "gap": 5.641555694578063, "train_loss": 1.8607487373631288, "val_loss": 7.502304431941192, "train_frac": 0.053934733072916664, "val_frac": 0.035059611002604164}, {"bucket": "4", "gap": 5.15452624859626, "train_loss": 2.012049924201289, "val_loss": 7.166576172797549, "train_frac": 0.03850131564670139, "val_frac": 0.026823255750868056}, {"bucket": "5", "gap": 4.815263190578094, "train_loss": 2.1542115223683473, "val_loss": 6.969474712946441, "train_frac": 0.029354519314236112, "val_frac": 0.022093031141493056}, {"bucket": "6-10", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "11-20", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "21-50", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "51-100", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "101-200", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "201-500", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "501-1k", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "1k-5k", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}, {"bucket": "5k+", "gap": 0, "train_loss": 0, "val_loss": 0, "train_frac": 0, "val_frac": 0}]};
    var bucketOrder = ["novel", "1", "2", "3", "4", "5", "6-10", "11-20", "21-50", "51-100", "101-200", "201-500", "501-1k", "1k-5k", "5k+"];

    function plotDist(branch, button) {
      if (button) {
        document.querySelectorAll('.controls button').forEach(function(b) {
          b.classList.remove('active');
        });
        button.classList.add('active');
      }
      var d = gapData[branch];
      var trainTrace = {
        x: d.map(function(x){return x.bucket}),
        y: d.map(function(x){return x.train_frac}),
        customdata: d.map(function(x){return [x.train_loss, x.val_loss, x.gap]}),
        type: "bar",
        name: "train fraction",
        marker: {color: "#2d6f9f"},
        hovertemplate: "bucket=%{x}<br>train fraction=%{y:.2%}<br>train loss=%{customdata[0]:.3f}<br>val loss=%{customdata[1]:.3f}<br>gap=%{customdata[2]:.3f}<extra></extra>"
      };
      var valTrace = {
        x: d.map(function(x){return x.bucket}),
        y: d.map(function(x){return x.val_frac}),
        customdata: d.map(function(x){return [x.train_loss, x.val_loss, x.gap]}),
        type: "bar",
        name: "val fraction",
        marker: {color: "#c4493d"},
        hovertemplate: "bucket=%{x}<br>val fraction=%{y:.2%}<br>train loss=%{customdata[0]:.3f}<br>val loss=%{customdata[1]:.3f}<br>gap=%{customdata[2]:.3f}<extra></extra>"
      };
      var gapTrace = {
        x: d.map(function(x){return x.bucket}),
        y: d.map(function(x){return x.gap}),
        customdata: d.map(function(x){return [x.train_frac, x.val_frac, x.train_loss, x.val_loss]}),
        mode: "lines+markers",
        name: "final gap",
        line: {color: "#353d79", width: 3},
        marker: {color: "#353d79", size: 7},
        yaxis: "y2",
        hovertemplate: "bucket=%{x}<br>final gap=%{y:.3f}<br>train fraction=%{customdata[0]:.2%}<br>val fraction=%{customdata[1]:.2%}<br>train loss=%{customdata[2]:.3f}<br>val loss=%{customdata[3]:.3f}<extra></extra>"
      };
      Plotly.newPlot("dist_chart", [trainTrace, valTrace, gapTrace], {
        title: "命中频次分布 + 末态 gap · " + branch,
        barmode: "group",
        xaxis: {title: "hit count bucket", type: "category", categoryorder: "array",
                categoryarray: bucketOrder, tickangle: -42},
        yaxis: {title: "token fraction", rangemode: "tozero"},
        yaxis2: {title: "final gap = val loss − train loss", side: "right",
                 overlaying: "y", zeroline: true, zerolinecolor: "#232426",
                 zerolinewidth: 1},
        margin: {l:70,r:85,t:50,b:90}, showlegend: true
      });
    }
    plotDist("bigram", document.querySelector('.controls button'));
    </script>
</body></html>
