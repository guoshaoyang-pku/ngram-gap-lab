<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log-x frequency → gap</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 12px; background: #fafafa; }
  h2 { font-size: 1.1em; }
  .chart { width: 100%; max-width: 900px; height: 320px; margin: 10px 0; }
  .controls { margin: 8px 0; font-size: 0.9em; }
  .controls button { padding: 4px 10px; margin: 2px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
  .controls button.active { background: #333; color: #fff; }
  .note { font-size: 0.85em; color: #666; margin: 8px 0; }
</style></head><body>
<h2>Log-x frequency → gap</h2>
<p class="note">使用原始 15 个真实频率桶；novel 被排除，因为 train hit count=0 时没有 train token loss，无法定义同桶 gap。x 轴为对数尺度，y 轴为线性尺度。</p>

    <div class="controls">
      <b>context:</b>
      <button class="active" onclick="setVisible('both', this)">both</button>
      <button onclick="setVisible('bigram', this)">bigram</button>
      <button onclick="setVisible('trigram', this)">trigram</button>
    </div>
    <div id="log_gap_chart" class="chart"></div>
    
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<script>
    var logData = {"bigram": [{"bucket": "1", "x": 1.0, "x_low": 1, "x_high": 1, "gap": 11.534540391335323, "train_count": 20948, "val_count": 12905, "train_frac": 0.035515679253472224, "val_frac": 0.021879408094618056, "train_loss": 0.2825824169432476, "val_loss": 11.81712280827857}, {"bucket": "2", "x": 2.0, "x_low": 2, "x_high": 2, "gap": 10.34390245212295, "train_count": 12920, "val_count": 9139, "train_frac": 0.021904839409722224, "val_frac": 0.015494452582465278, "train_loss": 0.6728494404701303, "val_loss": 11.016751892593081}, {"bucket": "3", "x": 3.0, "x_low": 3, "x_high": 3, "gap": 9.377202116820435, "train_count": 9295, "val_count": 7424, "train_frac": 0.015758938259548612, "val_frac": 0.012586805555555556, "train_loss": 0.9304110993140233, "val_loss": 10.307613216134458}, {"bucket": "4", "x": 4.0, "x_low": 4, "x_high": 4, "gap": 9.063850640463219, "train_count": 7781, "val_count": 6184, "train_frac": 0.013192070855034722, "val_frac": 0.010484483506944444, "train_loss": 1.0423545926784503, "val_loss": 10.106205233141669}, {"bucket": "5", "x": 5.0, "x_low": 5, "x_high": 5, "gap": 8.828389622227093, "train_count": 6548, "val_count": 5443, "train_frac": 0.011101616753472222, "val_frac": 0.009228176540798612, "train_loss": 1.161860519577052, "val_loss": 9.990250141804145}], "trigram": [{"bucket": "1", "x": 1.0, "x_low": 1, "x_high": 1, "gap": 7.305633663084213, "train_count": 163779, "val_count": 49598, "train_frac": 0.2776743570963542, "val_frac": 0.08408949110243055, "train_loss": 0.9184644851535152, "val_loss": 8.224098148237728}, {"bucket": "2", "x": 2.0, "x_low": 2, "x_high": 2, "gap": 6.305232832249715, "train_count": 56061, "val_count": 29206, "train_frac": 0.0950469970703125, "val_frac": 0.04951646592881945, "train_loss": 1.5070894112523223, "val_loss": 7.812322243502037}, {"bucket": "3", "x": 3.0, "x_low": 3, "x_high": 3, "gap": 5.641555694578063, "train_count": 31812, "val_count": 20679, "train_frac": 0.053934733072916664, "val_frac": 0.035059611002604164, "train_loss": 1.8607487373631288, "val_loss": 7.502304431941192}, {"bucket": "4", "x": 4.0, "x_low": 4, "x_high": 4, "gap": 5.15452624859626, "train_count": 22709, "val_count": 15821, "train_frac": 0.03850131564670139, "val_frac": 0.026823255750868056, "train_loss": 2.012049924201289, "val_loss": 7.166576172797549}, {"bucket": "5", "x": 5.0, "x_low": 5, "x_high": 5, "gap": 4.815263190578094, "train_count": 17314, "val_count": 13031, "train_frac": 0.029354519314236112, "val_frac": 0.022093031141493056, "train_loss": 2.1542115223683473, "val_loss": 6.969474712946441}]};
    var colors = {bigram: "#353d79", trigram: "#c4493d"};
    function makeTrace(branch) {
      var d = logData[branch];
      return {
        x: d.map(function(x){return x.x}),
        y: d.map(function(x){return x.gap}),
        customdata: d.map(function(x){return [x.bucket, x.x_low, x.x_high, x.train_count, x.val_count, x.train_frac, x.val_frac, x.train_loss, x.val_loss]}),
        mode: "lines+markers",
        name: branch,
        line: {color: colors[branch], width: 2.5},
        marker: {color: colors[branch], size: 8},
        error_x: {
          type: "data",
          symmetric: false,
          array: d.map(function(x){return x.x_high - x.x}),
          arrayminus: d.map(function(x){return x.x - x.x_low}),
          color: colors[branch],
          thickness: 1.2,
          width: 4
        },
        hovertemplate: "bucket=%{customdata[0]}<br>frequency range=%{customdata[1]}–%{customdata[2]}<br>gap=%{y:.3f}<br>train tokens=%{customdata[3]:,}<br>val tokens=%{customdata[4]:,}<br>train fraction=%{customdata[5]:.2%}<br>val fraction=%{customdata[6]:.2%}<br>train mean token loss=%{customdata[7]:.3f}<br>val mean token loss=%{customdata[8]:.3f}<extra></extra>"
      };
    }
    function setVisible(which, button) {
      if (button) {
        document.querySelectorAll('.controls button').forEach(function(b){b.classList.remove('active')});
        button.classList.add('active');
      }
      var visibility = which === "both" ? [true, true] :
        (which === "bigram" ? [true, "legendonly"] : ["legendonly", true]);
      Plotly.restyle("log_gap_chart", {visible: visibility});
    }
    Plotly.newPlot("log_gap_chart", [makeTrace("bigram"), makeTrace("trigram")], {
      title: "Final per-bucket gap vs training hit count",
      xaxis: {title: "training hit count (log scale)", type: "log", dtick: 1},
      yaxis: {title: "final gap = val loss − train loss", zeroline: true},
      margin: {l:70,r:30,t:50,b:65}, showlegend: true,
      legend: {x: 0.02, y: 0.98}
    });
    </script>
</body></html>
